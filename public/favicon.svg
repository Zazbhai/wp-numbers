<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brand" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#10B981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark rounded base with vibrant emerald border -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- WhatsApp Chat Bubble Shield with Glow -->
  <g filter="url(#glowShadow)">
    <path d="M32 11C20.4 11 11 20.4 11 32C11 35.8 12.05 39.4 13.9 42.5L12 50.5L20.3 48.7C23.3 50.3 26.6 51.2 30.1 51.3L32 51.3C43.6 51.3 53 42 53 30.3C53 18.7 43.6 11 32 11Z" fill="url(#brand)" />
  </g>

  <!-- Top highlight curve -->
  <path d="M20 19.5C23.5 16.5 27.5 15 32 15C36.5 15 40.5 16.5 44 19.5C40.5 17.5 36.5 16.5 32 16.5C27.5 16.5 23.5 17.5 20 19.5Z" fill="#FFFFFF" opacity="0.45" />

  <!-- Verification Checkmark -->
  <path d="M23.5 31.5L29 37L40.5 25" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Gold Star / Sparkle in top right corner -->
  <path d="M47 16L48 13L51 12L48 11L47 8L46 11L43 12L46 13L47 16Z" fill="#FACC15" />
</svg>

